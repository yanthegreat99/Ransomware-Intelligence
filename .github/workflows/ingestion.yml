name: Scheduled ingestion

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ransomware-ingestion
      cancel-in-progress: false
    steps:
      - name: Trigger configured ingestion endpoint
        env:
          INGESTION_URL: ${{ secrets.INGESTION_URL }}
          INGESTION_JOB_SECRET: ${{ secrets.INGESTION_JOB_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$INGESTION_URL" ]]; then
            echo "::error::Set the INGESTION_URL Actions secret to your deployed app URL."
            exit 1
          fi
          if [[ -z "$INGESTION_JOB_SECRET" ]]; then
            echo "::error::Set the INGESTION_JOB_SECRET Actions secret to the same value configured in Prisma Composer."
            exit 1
          fi

          base_url="${INGESTION_URL%/}"
          if [[ "$base_url" == */api/ingest ]]; then
            endpoint="$base_url"
          else
            endpoint="$base_url/api/ingest"
          fi

          curl --fail-with-body --show-error --retry 3 --retry-delay 30 \
            -X POST "$endpoint" \
            -H "Authorization: Bearer $INGESTION_JOB_SECRET" \
            -H "Content-Type: application/json"
