name: Database maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require database connection secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Normalize countries
        run: npm run countries:normalize

      - name: Backfill target domains
        run: npm run domains:backfill

      - name: Seed GICS taxonomy
        run: npm run gics:seed

      - name: Normalize and merge ransomware groups
        run: npm run groups:normalize -- --apply
